<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1226" />
    <title>Ink Tide — Cel-Shaded Ocean Racing</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0a1226;
        --foam: #eefaff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: var(--ink);
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app { position: fixed; inset: 0; }
      canvas#scene { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(120% 100% at 50% 30%, #12325e 0%, #0a1226 70%);
        color: var(--foam); z-index: 50; transition: opacity 500ms ease;
      }
      #boot .title {
        font-size: clamp(38px, 9vw, 96px); font-weight: 900; letter-spacing: 0.14em;
        text-transform: uppercase; text-shadow: 0 6px 0 #0a1226, 0 0 34px #39ff9c66;
      }
      #boot .sub { margin-top: 14px; letter-spacing: 0.34em; font-size: 13px; opacity: 0.75; text-transform: uppercase; }
      #boot.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="hud"></div>
    </div>
    <div id="boot">
      <div style="text-align:center">
        <div class="title">Ink Tide</div>
        <div class="sub">Loading the ocean</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
